services:
  mysql:
    image: mysql:8.4
    container_name: merito-mysql
    environment:
      MYSQL_DATABASE: abastecimento
      MYSQL_USER: merito
      MYSQL_PASSWORD: merito
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "4306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umerito", "-pmerito"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
