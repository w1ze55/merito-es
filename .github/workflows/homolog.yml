name: homolog

# Publica a aplicação na infra criada pelo Terraform (infra/).
# Secrets: AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY do usuário merito-es-homolog-github-deploy.
# Variables: saída "github_variables" do Terraform.

on:
  push:
    branches: [homolog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homolog
  cancel-in-progress: false

jobs:
  api:
    name: API · build, testes e deploy na EC2
    runs-on: ubuntu-latest

    # O contextLoads sobe o Flyway e precisa de um MySQL igual ao do docker-compose.yml.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: abastecimento
          MYSQL_USER: merito
          MYSQL_PASSWORD: merito
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 4306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -umerito -pmerito"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build e testes
        working-directory: backend
        run: ./mvnw -B verify

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        env:
          IMAGEM: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
        run: |
          docker build -t "$IMAGEM:$GITHUB_SHA" -t "$IMAGEM:homolog" backend
          docker push --all-tags "$IMAGEM"

      - name: Deploy na EC2
        env:
          INSTANCIA: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          comando=$(aws ssm send-command \
            --instance-ids "$INSTANCIA" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "commands=[\"/opt/merito/deploy.sh $GITHUB_SHA\"]" \
            --query Command.CommandId --output text)

          # O aws ssm wait desiste em 100 s; o deploy.sh espera a API por até 3 minutos.
          status=Pending
          for _ in $(seq 1 60); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$comando" --instance-id "$INSTANCIA" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$comando" --instance-id "$INSTANCIA" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status do deploy: $status"
          [ "$status" = Success ]

  web:
    name: Frontend · build e publicação no S3
    needs: api
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: merito-es

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: merito-es/package-lock.json

      - run: npm ci

      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Os assets têm hash no nome e podem ficar em cache para sempre; o resto é revalidado.
      # Os assets antigos continuam no bucket para quem ainda está com a versão anterior aberta.
      - name: Publicação no S3
        env:
          BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://$BUCKET" --delete --exclude "assets/*" --cache-control "no-cache"

      - name: Invalidação do CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
